services:
  - type: cron
    name: scentmotion-bot-ventas
    runtime: python
    region: frankfurt
    plan: starter
    schedule: "*/2 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python sm_bot.py once
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: MAKMIK_EMAIL
        sync: false
      - key: MAKMIK_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.4"
