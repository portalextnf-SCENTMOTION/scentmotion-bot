name: Bot ventas SCENTMOTION

# Lo lanza cron-job.org cada 5 minutos (boton "Run workflow" = workflow_dispatch).
# Se quito el reloj propio de GitHub: era poco fiable y duplicaba pasadas.
on:
  workflow_dispatch:

concurrency:
  group: bot-ventas
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Estado del bot (ventas ya avisadas, resumen enviado...) guardado en la
      # cache de GitHub, gratis y sin limite de horas. Sustituye a la base Neon.
      - name: Recuperar estado
        uses: actions/cache/restore@v4
        with:
          path: sm_state.json
          key: sm-state-${{ github.run_id }}
          restore-keys: sm-state-

      - run: python sm_bot.py once
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAKMIK_EMAIL: ${{ secrets.MAKMIK_EMAIL }}
          MAKMIK_PASSWORD: ${{ secrets.MAKMIK_PASSWORD }}
          STATE_FILE: sm_state.json

      - name: Guardar estado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: sm_state.json
          key: sm-state-${{ github.run_id }}
