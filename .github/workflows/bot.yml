name: Bot ventas SCENTMOTION

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: bot-ventas
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python sm_bot.py once
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAKMIK_EMAIL: ${{ secrets.MAKMIK_EMAIL }}
          MAKMIK_PASSWORD: ${{ secrets.MAKMIK_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
